        # =================================================
        # WEATHER PAGE SMART TOUCH AREA
        # =================================================
        - obj:
            id: weather_touch_area
            x: 0
            y: 0
            width: 480
            height: 480
            bg_opa: 0%
            border_width: 0
            radius: 0
            
            on_click:
              - lambda: |-
                  if (id(current_page) == 0) {
                    id(open_weather_screen).execute();
                  } else if (id(current_page) == 1) {
                    id(open_camera_screen).execute();
                  } else {
                    id(screen_switch).turn_off();
                  }

    # =====================================================
    # CAMERA PAGE

# =========================================================
# HOME ASSISTANT WEATHER SENSORS
# =========================================================
sensor:
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.your_weather_entity_hourly
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: weather_temperature
          text:
            format: "%.1f°C"
            args: [ "x" ]

  - platform: homeassistant
    id: weather_hum
    entity_id: weather.your_weather_entity_hourly
    attribute: humidity
    on_value:
      - lvgl.label.update:
          id: weather_humidity
          text:
            format: "Humidity: %.0f%%"
            args: [ "x" ]

  - platform: homeassistant
    id: weather_pres
    entity_id: weather.your_weather_entity_hourly
    attribute: pressure
    on_value:
      - lvgl.label.update:
          id: weather_pressure
          text:
            format: "Pressure: %.1f hPa"
            args: [ "x" ]

  - platform: homeassistant
    id: weather_wind_spd
    entity_id: weather.your_weather_entity_hourly
    attribute: wind_speed
    on_value:
      - lvgl.label.update:
          id: weather_wind
          text:
            format: "Wind: %.1f km/h"
            args: [ "x" ]
        
# =========================================================
# CURRENT WEATHER CONDITION (COLORED)
# =========================================================
text_sensor:
  - platform: homeassistant
    id: current_weather_condition
    entity_id: weather.your_weather_entity_hourly
    on_value:
      then:
        - lvgl.label.update:
            id: weather_current_icon
            text: !lambda |-
              if (x == "sunny") return std::string("#FFC107 \U000F0599#");
              if (x == "clear-night") return std::string("#5C6BC0 \U000F0594#");
              if (x == "partlycloudy") return std::string("#FFE082 \U000F0595#");
              if (x == "cloudy") return std::string("#B0BEC5 \U000F0590#");
              if (x == "fog") return std::string("#90A4AE \U000F0591#");
              if (x == "rainy") return std::string("#29B6F6 \U000F0597#");
              if (x == "pouring") return std::string("#0288D1 \U000F0596#");
              if (x == "lightning" || x == "lightning-rainy") return std::string("#FFA000 \U000F067E#");
              if (x == "snowy" || x == "snowy-rainy") return std::string("#E1F5FE \U000F0598#");
              return std::string("#FFFFFF \U000F14E4#");

        - lvgl.label.update:
            id: weather_condition_text
            text: !lambda |-
              if (x == "sunny") return std::string("Sunny");
              if (x == "clear-night") return std::string("Clear");
              if (x == "partlycloudy") return std::string("Partly Cloudy");
              if (x == "cloudy") return std::string("Cloudy");
              if (x == "fog") return std::string("Fog");
              if (x == "hail") return std::string("Hail");
              if (x == "lightning") return std::string("Lightning");
              if (x == "lightning-rainy") return std::string("Thunderstorm");
              if (x == "pouring") return std::string("Heavy Rain");
              if (x == "rainy") return std::string("Rainy");
              if (x == "snowy") return std::string("Snowy");
              if (x == "snowy-rainy") return std::string("Sleet");
              if (x == "windy" || x == "windy-variant") return std::string("Windy");
              return std::string("Weather");
              
# =========================================================
# DOOR STATUS & AUTO WEATHER CONDITIONS
# =========================================================
binary_sensor:
  - platform: homeassistant
    id: door_open
    entity_id: binary_sensor.your_door_sensor
    on_state:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: door_open
                - switch.is_on: allow_auto_weather
            then:
              - script.execute: open_weather_screen

# =========================================================
# FORECAST GLOBAL VARIABLES & PAGE MEMORY
# =========================================================
globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: "0"

  - id: forecast_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: forecast_temperature
    type: float[8]
    restore_value: no
  - id: forecast_hour
    type: int[8]
    restore_value: no
  - id: forecast_icon
    type: std::string[8]
    restore_value: no

# =========================================================
# FORECAST SCREEN UPDATE & JSON FETCH
# =========================================================
script:
  # -------------------------------------------------------
  # Update Forecast Labels
  # -------------------------------------------------------
  - id: weather_ui_update
    mode: restart
    then:
      - lvgl.label.update:
          id: fc_hour_1
          text: { format: "%02d:00", args: [ "id(forecast_hour)[0]" ] }
      - lvgl.label.update:
          id: fc_icon_1
          text: !lambda return id(forecast_icon)[0];
      - lvgl.label.update:
          id: fc_temp_1
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[0]" ] }

      - lvgl.label.update:
          id: fc_hour_2
          text: { format: "%02d:00", args: [ "id(forecast_hour)[1]" ] }
      - lvgl.label.update:
          id: fc_icon_2
          text: !lambda return id(forecast_icon)[1];
      - lvgl.label.update:
          id: fc_temp_2
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[1]" ] }

      - lvgl.label.update:
          id: fc_hour_3
          text: { format: "%02d:00", args: [ "id(forecast_hour)[2]" ] }
      - lvgl.label.update:
          id: fc_icon_3
          text: !lambda return id(forecast_icon)[2];
      - lvgl.label.update:
          id: fc_temp_3
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[2]" ] }

      - lvgl.label.update:
          id: fc_hour_4
          text: { format: "%02d:00", args: [ "id(forecast_hour)[3]" ] }
      - lvgl.label.update:
          id: fc_icon_4
          text: !lambda return id(forecast_icon)[3];
      - lvgl.label.update:
          id: fc_temp_4
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[3]" ] }

      - lvgl.label.update:
          id: fc_hour_5
          text: { format: "%02d:00", args: [ "id(forecast_hour)[4]" ] }
      - lvgl.label.update:
          id: fc_icon_5
          text: !lambda return id(forecast_icon)[4];
      - lvgl.label.update:
          id: fc_temp_5
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[4]" ] }

      - lvgl.label.update:
          id: fc_hour_6
          text: { format: "%02d:00", args: [ "id(forecast_hour)[5]" ] }
      - lvgl.label.update:
          id: fc_icon_6
          text: !lambda return id(forecast_icon)[5];
      - lvgl.label.update:
          id: fc_temp_6
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[5]" ] }

      - lvgl.label.update:
          id: fc_hour_7
          text: { format: "%02d:00", args: [ "id(forecast_hour)[6]" ] }
      - lvgl.label.update:
          id: fc_icon_7
          text: !lambda return id(forecast_icon)[6];
      - lvgl.label.update:
          id: fc_temp_7
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[6]" ] }

      - lvgl.label.update:
          id: fc_hour_8
          text: { format: "%02d:00", args: [ "id(forecast_hour)[7]" ] }
      - lvgl.label.update:
          id: fc_icon_8
          text: !lambda return id(forecast_icon)[7];
      - lvgl.label.update:
          id: fc_temp_8
          text: { format: "%.0f°", args: [ "id(forecast_temperature)[7]" ] }

  # -------------------------------------------------------
  # Fetch Forecast from HA
  # -------------------------------------------------------
  - id: weather_fetch
    mode: restart
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: weather.your_weather_entity_hourly
            type: hourly
          capture_response: true
          on_success:
            then:
            - lambda: |-
                  JsonArrayConst forecasts = response["response"]["weather.your_weather_entity_hourly"]["forecast"];
                  id(forecast_count) = 0;

                  for (JsonObjectConst item : forecasts) {
                    if (id(forecast_count) >= 8) break;
                    int i = id(forecast_count);
                    
                    id(forecast_temperature)[i] = item["temperature"].as<float>();
                    std::string datetime = item["datetime"].as<std::string>();
                    std::string condition = item["condition"].as<std::string>();
                    
                    int hour = 0;
                    if (datetime.length() >= 13) {
                      hour = atoi(datetime.substr(11, 2).c_str());
                    }
                    // Adjust to your local timezone (e.g., +3 for TRT)
                    hour += 3; 
                    if (hour >= 24) hour -= 24;
                    id(forecast_hour)[i] = hour;

                    if (condition == "sunny") id(forecast_icon)[i] = "#FFC107 \U000F0599#";
                    else if (condition == "clear-night") id(forecast_icon)[i] = "#5C6BC0 \U000F0594#";
                    else if (condition == "partlycloudy") id(forecast_icon)[i] = "#FFE082 \U000F0595#";
                    else if (condition == "cloudy") id(forecast_icon)[i] = "#B0BEC5 \U000F0590#";
                    else if (condition == "fog") id(forecast_icon)[i] = "#90A4AE \U000F0591#";
                    else if (condition == "rainy") id(forecast_icon)[i] = "#29B6F6 \U000F0597#";
                    else if (condition == "pouring") id(forecast_icon)[i] = "#0288D1 \U000F0596#";
                    else if (condition == "lightning" || condition == "lightning-rainy") id(forecast_icon)[i] = "#FFA000 \U000F067E#";
                    else if (condition == "snowy" || condition == "snowy-rainy") id(forecast_icon)[i] = "#E1F5FE \U000F0598#";
                    else id(forecast_icon)[i] = "#FFFFFF \U000F14E4#";

                    id(forecast_count)++;
                  }
                  ESP_LOGI("weather", "Forecast fetched: %d records", id(forecast_count));
            - script.execute: weather_ui_update
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "weather.get_forecasts failed"

  # =======================================================
  # OPEN WEATHER SCREEN
  # =======================================================
  - id: open_weather_screen
    mode: restart
    then:
      - globals.set:
          id: current_page
          value: '1'
      - light.turn_on:
          id: display_backlight
          brightness: 80%
      - lambda: |-
          id(camera_stream).set_stream_active(false);
      - lvgl.page.show:
          id: weather_page
          animation: MOVE_RIGHT
          time: 250ms
      - script.execute: weather_fetch
      - switch.template.publish:
          id: screen_switch
          state: ON
      - script.execute: auto_turn_off_screen

  # =======================================================
  # OPEN CAMERA SCREEN
  # =======================================================
  - id: open_camera_screen
    mode: restart
    then:
      - globals.set:
          id: current_page
          value: '2'
      - light.turn_on:
          id: display_backlight
          brightness: 80%
      - lvgl.page.show:
          id: camera_page
          animation: MOVE_LEFT
          time: 250ms
      - lambda: |-
          id(camera_stream).set_stream_active(true);
      - switch.template.publish:
          id: screen_switch
          state: ON
      - script.execute: auto_turn_off_screen

  # =======================================================
  # AUTO TURN OFF
  # =======================================================
  - id: auto_turn_off_screen
    mode: restart
    then:
      - delay: 30s
      - switch.turn_off: screen_switch

# =========================================================
# SCREEN AND PERMISSION SWITCHES 
# =========================================================
switch:
  - platform: template
    name: "Screen"
    id: screen_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_on: door_open
          then:
            - script.execute: open_weather_screen
          else:
            - script.execute: open_camera_screen
    turn_off_action:
      - globals.set:
          id: current_page
          value: '0'
      - script.stop: auto_turn_off_screen
      - light.turn_off:
          id: display_backlight
      - lambda: |-
          id(camera_stream).set_stream_active(false);
      # SWITCH TO WEATHER IN BACKGROUND WHEN OFF (Anti-Flicker)
      - lvgl.page.show:
          id: weather_page
          animation: NONE

  # Auto permission when door opens
  - platform: template
    name: "Auto Screen: Door Weather"
    id: allow_auto_weather
    icon: "mdi:door-open"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Auto permission for motion/bell automations
  - platform: template
    name: "Auto Screen: Camera View"
    id: allow_auto_camera
    icon: "mdi:motion-sensor"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# =========================================================
# DIRECT CAMERA/WEATHER ACTION BUTTONS FROM HA
# =========================================================
button:
  - platform: template
    name: "Show Camera"
    id: show_camera_btn
    icon: "mdi:cctv"
    on_press:
      - if:
          condition:
            switch.is_on: allow_auto_camera
          then:
            - script.execute: open_camera_screen

  - platform: template
    name: "Show Weather"
    id: show_weather_btn
    icon: "mdi:weather-partly-cloudy"
    on_press:
      - if:
          condition:
            switch.is_on: allow_auto_weather
          then:
            - script.execute: open_weather_screen

# =========================================================
# DISPLAY
# =========================================================
display:
  - platform: mipi_rgb
    id: lcd_display
    model: CUSTOM
    cs_pin:
      pca9554: expander
      number: 0
      id: lcd_spi_cs
    data_rate: 1MHz
    data_pins:
      blue: [40, 41, 42, 2, 1]
      green: [21, 8, 18, 45, 38, 39]
      red: [10, 11, 12, 13, 14]
    de_pin: GPIO17
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO9
    pclk_frequency: 16MHz
    pclk_inverted: false
    pixel_mode: 16bit
    dimensions:
      width: 480
      height: 480
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    invert_colors: false
    init_sequence:
      - [0x11]
      - [0x29]

# =========================================================
# TOUCH
# =========================================================
touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bus_a
    display: lcd_display
    address: 0x14
    update_interval: 20ms

# =========================================================
# CAMERA STREAM
# =========================================================
mjpeg_stream:
  id: camera_stream
  url: "http://YOUR_GO2RTC_IP:1984/api/stream.mjpeg?src=YOUR_CAMERA_NAME"
  width: 480
  height: 480
  jpeg_buffer_size: 131072

# =========================================================
# LVGL DESIGN
# =========================================================
lvgl:
  displays:
    - lcd_display
  touchscreens:
    - touch_panel

  pages:
    # =====================================================
    # WEATHER PAGE
    # =====================================================
    - id: weather_page
      # Midnight blue gradient effect
      bg_color: 0x0B192C        
      bg_grad_color: 0x3A506B   
      bg_grad_dir: VER
      widgets:
        
        # -------------------------------------------------
        # BIG CURRENT ICON & TEMP (LEFT SIDE)
        # -------------------------------------------------
        - label:
            id: weather_current_icon
            x: 20
            y: 30
            width: 140
            height: 100
            recolor: true
            text: "\U000F14E4"
            text_font: weather_icon_96
            text_align: CENTER
            text_color: 0xFFFFFF
            
        - label:
            id: weather_temperature
